target-version = "py314"
line-length = 100

[lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "PT",    # flake8-pytest-style
]

# The formatter owns line wrapping; E501 would additionally flag long
# strings, URLs and comments that cannot be wrapped.
ignore = ["E501"]

[lint.isort]
known-first-party = ["shared", "order", "warehouse"]

[format]
quote-style = "double"
