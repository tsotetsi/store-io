server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (single page app).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser only ever talks to this origin; nginx forwards /api to the
    # control service, so no CORS or exposed Docker socket is involved.
    location /api/ {
        proxy_pass http://control-service:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Server-Sent Events must stream through untouched.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
